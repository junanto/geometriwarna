<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Interaktif Seni Rupa: Warna & Bentuk</title>

    <style>
        :root {
            --primary: #4a90e2;
            --secondary: #f5a623;
            --success: #2ecc71;
            --danger: #e74c3c;
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0f2fe, #fef3c7);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .quiz-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 650px;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
            padding: 30px;
            overflow: hidden;
        }

        .title {
            text-align: center;
            font-size: 1.7rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .subtitle {
            text-align: center;
            margin-top: -10px;
            margin-bottom: 20px;
            color: #666;
            font-size: 0.95rem;
        }

        .progress-container {
            width: 100%;
            height: 14px;
            background: #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #4a90e2, #2ecc71);
            border-radius: 20px;
            transition: width 0.3s ease;
        }

        .quiz-info {
            display: flex;
            justify-content: space-between;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .question-card {
            background: #f8fafc;
            border-radius: 15px;
            padding: 22px;
            border: 2px solid #e5e7eb;
        }

        .question {
            font-size: 1.2rem;
            line-height: 1.6;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-option {
            width: 100%;
            padding: 15px 18px;
            border: 2px solid #dbe3ec;
            border-radius: 12px;
            background: white;
            color: #333;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .btn-option:hover {
            background: #eff6ff;
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        .btn-option.selected {
            background: #dbeafe;
            border-color: var(--primary);
            color: #075985;
            font-weight: 700;
        }

        .navigation {
            display: flex;
            justify-content: flex-end;
            margin-top: 25px;
        }

        .btn-next,
        .btn-restart {
            border: none;
            border-radius: 12px;
            padding: 13px 28px;
            font-size: 1rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .btn-next {
            background: var(--primary);
        }

        .btn-next:hover:not(:disabled) {
            background: #357abd;
            transform: translateY(-1px);
        }

        .btn-next:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        /* HASIL */
        .result-view {
            text-align: center;
            padding: 15px 0;
        }

        .result-icon {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        .result-title {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 15px;
            font-weight: 800;
        }

        .score-box {
            font-size: 4.5rem;
            line-height: 1;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .score-details {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 20px;
        }

        .message {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .stars-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
        }

        .star {
            font-size: 3rem;
            color: #d1d5db;
        }

        .star.active {
            color: #f5a623;
            animation: pop 0.4s ease forwards;
        }

        @keyframes pop {
            0% {
                transform: scale(0);
            }

            80% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        .btn-restart {
            background: var(--success);
        }

        .btn-restart:hover {
            background: #27ae60;
            transform: translateY(-1px);
        }

        .footer {
            text-align: center;
            color: #888;
            font-size: 0.8rem;
            margin-top: 25px;
        }

        @media (max-width: 500px) {
            body {
                padding: 10px;
            }

            .quiz-container {
                padding: 20px;
            }

            .title {
                font-size: 1.35rem;
            }

            .question {
                font-size: 1.05rem;
            }

            .btn-option {
                font-size: 0.95rem;
            }

            .score-box {
                font-size: 3.5rem;
            }
        }
    </style>
</head>

<body>

<div class="quiz-container">

    <!-- ================= HEADER ================= -->
    <div id="quiz-header">

        <div class="title">
            🎨 Kuis Seni Rupa: Warna & Bentuk
        </div>

        <div class="subtitle">
            Yuk belajar warna dan bentuk sambil bermain!
        </div>

        <div class="progress-container">
            <div
                class="progress-bar"
                id="progress-bar">
            </div>
        </div>

        <div class="quiz-info">
            <span id="question-type">
                Pilihan Ganda
            </span>

            <span id="question-number">
                Soal 1 dari 20
            </span>
        </div>

    </div>


    <!-- ================= SOAL ================= -->
    <div id="dynamic-slide">

        <div class="question-card">

            <div
                class="question"
                id="question-text">
                Memuat soal...
            </div>

            <div
                class="options-container"
                id="options-container">
            </div>

            <div class="navigation">

                <button
                    class="btn-next"
                    id="btn-next"
                    disabled>
                    Lanjut ➜
                </button>

            </div>

        </div>

    </div>


    <!-- ================= HASIL ================= -->
    <div
        id="result-view"
        class="result-view"
        style="display: none;">

        <div class="result-icon">
            🏆
        </div>

        <div class="result-title">
            Kuis Selesai!
        </div>

        <div
            class="score-box"
            id="final-score">
            0
        </div>

        <div
            class="score-details"
            id="score-details">
            Kamu menjawab benar 0 dari 20 soal.
        </div>

        <div
            class="message"
            id="result-message">
        </div>

        <div
            class="stars-container"
            id="stars-container">

            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>

        </div>

        <button
            class="btn-restart"
            id="btn-restart">
            🔄 Ulangi Kuis
        </button>

    </div>

    <div class="footer">
        🌈 Belajar warna dan bentuk dengan menyenangkan! 🌈
    </div>

</div>


<script>

    // =====================================================
    // DATA SOAL
    // =====================================================

    const quizData = [

        // ================= PILIHAN GANDA =================

        {
            type: "pg",
            question:
                "Warna dasar yang tidak dibuat dari campuran warna lain disebut...",
            options: [
                "Warna Sekunder",
                "Warna Primer",
                "Warna Geometris",
                "Warna Indah"
            ],
            answer: 1
        },

        {
            type: "pg",
            question:
                "Berikut ini yang termasuk ke dalam kelompok warna primer adalah...",
            options: [
                "Merah, Kuning, Hijau",
                "Merah, Kuning, Biru",
                "Oranye, Hijau, Ungu",
                "Biru, Hijau, Ungu"
            ],
            answer: 1
        },

        {
            type: "pg",
            question:
                "Jika warna Kuning dicampur dengan warna Biru, maka akan menghasilkan warna sekunder yaitu...",
            options: [
                "Hijau",
                "Oranye",
                "Ungu",
                "Merah Muda"
            ],
            answer: 0
        },

        {
            type: "pg",
            question:
                "Benda di sekitar kita yang memiliki warna alami kuning adalah...",
            options: [
                "Apel dan Tomat",
                "Laut dan Langit",
                "Pisang dan Lemon",
                "Brokoli dan Daun"
            ],
            answer: 2
        },

        {
            type: "pg",
            question:
                "Campuran warna primer yang menghasilkan warna Oranye / Jingga adalah...",
            options: [
                "Kuning + Biru",
                "Merah + Biru",
                "Merah + Kuning",
                "Hijau + Ungu"
            ],
            answer: 2
        },

        {
            type: "pg",
            question:
                "Bentuk yang beraturan, memiliki ukuran pasti, dan sesuai dengan alat ukur disebut bentuk...",
            options: [
                "Nongeometris",
                "Primer",
                "Geometris",
                "Sekunder"
            ],
            answer: 2
        },

        {
            type: "pg",
            question:
                "Bentuk geometris yang memiliki 3 sisi adalah...",
            options: [
                "Lingkaran",
                "Persegi Panjang",
                "Segitiga",
                "Kotak"
            ],
            answer: 2
        },

        {
            type: "pg",
            question:
                "Setiap titik pada bentuk ini memiliki jarak yang sama dari titik pusatnya. Bentuk yang dimaksud adalah...",
            options: [
                "Persegi",
                "Lingkaran",
                "Segitiga siku-siku",
                "Batu"
            ],
            answer: 1
        },

        {
            type: "pg",
            question:
                "Bentuk kotak yang memiliki 4 sisi dengan panjang yang sama persis dinamakan...",
            options: [
                "Persegi Panjang",
                "Segitiga Sama Kaki",
                "Persegi",
                "Lingkaran"
            ],
            answer: 2
        },

        {
            type: "pg",
            question:
                "Manakah di bawah ini yang merupakan contoh benda berbentuk nongeometris?",
            options: [
                "Uang koin, ban, jam",
                "Piza, bendera, es krim cone",
                "Bunga, daun, batu",
                "Keramik, lemari, buku"
            ],
            answer: 2
        },


        // ================= BENAR / SALAH =================

        {
            type: "bs",
            question:
                "Warna sekunder adalah hasil pencampuran dari dua warna primer.",
            options: [
                "Benar",
                "Salah"
            ],
            answer: 0
        },

        {
            type: "bs",
            question:
                "Campuran antara warna Merah dan warna Biru akan menghasilkan warna Hijau.",
            options: [
                "Benar",
                "Salah"
            ],
            answer: 1
        },

        {
            type: "bs",
            question:
                "Laut dan langit merupakan contoh penampakan alam yang dominan berwarna biru.",
            options: [
                "Benar",
                "Salah"
            ],
            answer: 0
        },

        {
            type: "bs",
            question:
                "Wortel dan labu merupakan contoh benda di sekitar kita yang berwarna ungu.",
            options: [
                "Benar",
                "Salah"
            ],
            answer: 1
        },

        {
            type: "bs",
            question:
                "Bentuk nongeometris bersifat tidak beraturan dan tidak memiliki ukuran pasti.",
            options: [
                "Benar",
                "Salah"
            ],
            answer: 0
        },

        {
            type: "bs",
            question:
                "Segitiga yang salah satu sudutnya berukuran 90 derajat disebut segitiga sama sisi.",
            options: [
                "Benar",
                "Salah"
            ],
            answer: 1
        },

        {
            type: "bs",
            question:
                "Bentuk lingkaran memberikan kesan keharmonisan, keseimbangan, dan kesatuan.",
            options: [
                "Benar",
                "Salah"
            ],
            answer: 0
        },

        {
            type: "bs",
            question:
                "Persegi panjang memiliki 4 sisi yang ukuran panjangnya sama semua.",
            options: [
                "Benar",
                "Salah"
            ],
            answer: 1
        },

        {
            type: "bs",
            question:
                "Piza dan es krim cone merupakan contoh benda sehari-hari yang menyerupai bentuk segitiga.",
            options: [
                "Benar",
                "Salah"
            ],
            answer: 0
        },

        {
            type: "bs",
            question:
                "Bentuk adalah hasil gabungan dari garis lurus dan garis lengkung.",
            options: [
                "Benar",
                "Salah"
            ],
            answer: 0
        }

    ];


    // =====================================================
    // VARIABEL
    // =====================================================

    let currentQuestionIndex = 0;
    let score = 0;
    let selectedAnswer = null;


    // =====================================================
    // ELEMEN HTML
    // =====================================================

    const headerEl =
        document.getElementById("quiz-header");

    const dynamicSlideEl =
        document.getElementById("dynamic-slide");

    const resultViewEl =
        document.getElementById("result-view");

    const progressBarEl =
        document.getElementById("progress-bar");

    const questionTypeEl =
        document.getElementById("question-type");

    const questionNumberEl =
        document.getElementById("question-number");

    const questionTextEl =
        document.getElementById("question-text");

    const optionsContainerEl =
        document.getElementById("options-container");

    const btnNextEl =
        document.getElementById("btn-next");

    const btnRestartEl =
        document.getElementById("btn-restart");


    // =====================================================
    // MENAMPILKAN SOAL
    // =====================================================

    function showQuestion() {

        selectedAnswer = null;

        btnNextEl.disabled = true;

        const currentQuestion =
            quizData[currentQuestionIndex];


        // Progress bar
        const progressPercentage =
            (currentQuestionIndex / quizData.length) * 100;

        progressBarEl.style.width =
            `${progressPercentage}%`;


        // Jenis soal
        if (currentQuestion.type === "pg") {

            questionTypeEl.textContent =
                "Pilihan Ganda";

        } else {

            questionTypeEl.textContent =
                "Benar / Salah";
        }


        // Nomor soal
        questionNumberEl.textContent =
            `Soal ${currentQuestionIndex + 1} dari ${quizData.length}`;


        // Pertanyaan
        questionTextEl.textContent =
            currentQuestion.question;


        // Bersihkan opsi lama
        optionsContainerEl.innerHTML = "";


        // Membuat tombol jawaban
        currentQuestion.options.forEach(
            function(option, index) {

                const button =
                    document.createElement("button");

                button.className =
                    "btn-option";

                button.textContent =
                    option;

                button.addEventListener(
                    "click",
                    function() {
                        selectOption(index);
                    }
                );

                optionsContainerEl.appendChild(button);
            }
        );
    }


    // =====================================================
    // MEMILIH JAWABAN
    // =====================================================

    function selectOption(index) {

        selectedAnswer = index;


        const buttons =
            optionsContainerEl.getElementsByClassName(
                "btn-option"
            );


        // Hapus pilihan sebelumnya
        for (let button of buttons) {

            button.classList.remove(
                "selected"
            );
        }


        // Tandai pilihan
        buttons[index].classList.add(
            "selected"
        );


        // Aktifkan tombol Lanjut
        btnNextEl.disabled = false;
    }


    // =====================================================
    // SOAL BERIKUTNYA
    // =====================================================

    function nextQuestion() {

        // Jangan lanjut jika belum memilih
        if (selectedAnswer === null) {
            return;
        }


        // Cek jawaban
        if (
            selectedAnswer ===
            quizData[currentQuestionIndex].answer
        ) {

            score++;
        }


        // Pindah soal
        currentQuestionIndex++;


        // Jika masih ada soal
        if (
            currentQuestionIndex <
            quizData.length
        ) {

            showQuestion();

        } else {

            showResult();
        }
    }


    // =====================================================
    // MENAMPILKAN HASIL
    // =====================================================

    function showResult() {

        headerEl.style.display =
            "none";

        dynamicSlideEl.style.display =
            "none";

        resultViewEl.style.display =
            "block";


        // Hitung nilai
        const finalScore =
            Math.round(
                (score / quizData.length) * 100
            );


        document.getElementById(
            "final-score"
        ).textContent =
            finalScore;


        document.getElementById(
            "score-details"
        ).textContent =
            `Kamu menjawab benar ${score} dari ${quizData.length} soal.`;


        // Pesan berdasarkan nilai
        let message = "";

        if (finalScore === 100) {

            message =
                "🌟 Luar biasa! Semua jawaban benar!";

        } else if (finalScore >= 80) {

            message =
                "🎉 Hebat! Hasil belajarmu sangat bagus!";

        } else if (finalScore >= 60) {

            message =
                "😊 Bagus! Terus belajar agar semakin hebat!";

        } else if (finalScore >= 40) {

            message =
                "💪 Tetap semangat! Yuk belajar lagi!";

        } else {

            message =
                "📚 Jangan menyerah! Coba pelajari materi lagi.";
        }


        document.getElementById(
            "result-message"
        ).textContent =
            message;


        // Tentukan jumlah bintang
        let starsToEarn = 0;

        if (finalScore === 100) {

            starsToEarn = 5;

        } else if (finalScore >= 80) {

            starsToEarn = 4;

        } else if (finalScore >= 60) {

            starsToEarn = 3;

        } else if (finalScore >= 40) {

            starsToEarn = 2;

        } else if (finalScore > 0) {

            starsToEarn = 1;
        }


        // Ambil semua bintang
        const starElements =
            document
                .getElementById("stars-container")
                .getElementsByClassName("star");


        // Reset bintang
        for (let star of starElements) {

            star.classList.remove("active");
        }


        // Animasi bintang
        for (
            let i = 0;
            i < starsToEarn;
            i++
        ) {

            setTimeout(
                function() {

                    starElements[i]
                        .classList
                        .add("active");

                },
                i * 200
            );
        }


        // Progress penuh
        progressBarEl.style.width =
            "100%";
    }


    // =====================================================
    // ULANGI KUIS
    // =====================================================

    function restartQuiz() {

        currentQuestionIndex = 0;

        score = 0;

        selectedAnswer = null;


        headerEl.style.display =
            "block";

        dynamicSlideEl.style.display =
            "block";

        resultViewEl.style.display =
            "none";


        showQuestion();
    }


    // =====================================================
    // EVENT BUTTON
    // =====================================================

    btnNextEl.addEventListener(
        "click",
        nextQuestion
    );

    btnRestartEl.addEventListener(
        "click",
        restartQuiz
    );


    // =====================================================
    // MULAI KUIS
    // =====================================================

    window.addEventListener(
        "load",
        function() {
            showQuestion();
        }
    );

</script>

</body>
</html>
